[package]
name = "varve-app"
description = "The Varve desktop app: the Tauri shell and the Varve binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "varve_app"
path = "src/lib.rs"

[[bin]]
name = "varve"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
varve-core.workspace = true
varve-driver.workspace = true
varve-extension.workspace = true
varve-records.workspace = true
varve-secrets.workspace = true
varve-store.workspace = true
varve-activity = { path = "../../crates/activity" }
varve-catalog = { path = "../../crates/catalog" }
varve-driver-mysql = { path = "../../crates/driver-mysql" }
varve-driver-postgres = { path = "../../crates/driver-postgres" }
varve-driver-redis = { path = "../../crates/driver-redis" }
varve-live-stats = { path = "../../crates/live-stats" }
varve-redis-syntax.workspace = true
varve-tunnel = { path = "../../crates/tunnel" }
async-trait.workspace = true
tokio = { workspace = true, features = ["time", "net", "io-std"] }
# The local MCP server (src/mcp): Streamable HTTP on the loopback address,
# and the client side of the `varve mcp` stdio bridge (plain HTTP to
# 127.0.0.1, so reqwest needs no TLS).
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "transport-io", "client", "transport-streamable-http-client-reqwest"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio-util = "0.7.20"
getrandom = "0.3.4"
subtle = "2.6.1"
dirs = "7.0.0"
# The bridge asks the server to prove it holds the token before sending it
# (src/mcp/bridge.rs).
hmac = "0.13.0"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false }
# On Windows and Linux tauri-plugin-updater turns on reqwest's rustls without
# a crypto provider, so every reqwest client needs one installed first
# (ensure_crypto_provider in src/lib.rs): ring, as the drivers use.
rustls = { version = "0.23.46", default-features = false, features = ["std", "logging", "tls12", "ring"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# The native glass behind the window (src/glass.rs). Tauri already depends on it;
# calling it directly reports whether the effect was applied.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
window-vibrancy = "0.8.1"

# Updates (src/updates.rs). macOS: Sparkle, loaded at runtime from Contents/Frameworks
# (crates/sparkle holds the Objective-C calls).
[target.'cfg(target_os = "macos")'.dependencies]
varve-sparkle = { path = "../../crates/sparkle" }

# Windows and Linux: the Tauri updater with latest.json from the release.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2.14.0"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
# A plain MySQL client: the baseline the privilege tests compare Varve with.
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "tls12", "ring"] }

[lints]
workspace = true
