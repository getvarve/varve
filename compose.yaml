# The Varve server for development: the API and its database. Self-hosting uses compose.prod.yaml.
# Host ports stay clear of Tresso's stack and of dev/docker-compose.yml (the databases the app is tested against).
name: varve-server

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=18&charset=utf8
      API_PUBLIC_URL: http://localhost:8090
      RUN_MIGRATIONS: "1"
    volumes:
      - ./apps/api:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8090:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 120s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "54330:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
