name: Release

# Builds the installers for a version tag and publishes them as a GitHub
# release with SHA256SUMS. CI calls this workflow once every check of the
# tagged commit has passed, so a release never ships a red commit.
# install.sh and install.ps1 download these assets by their fixed names.
#
# It also publishes the in-app update feeds (scripts/update-feeds.mjs): latest.json for the Tauri
# updater on Windows and Linux, and appcast-arm64.xml and appcast-x64.xml for Sparkle on macOS.
# The signing keys live in 1Password ("Tauri updater signing key (Varve)", "Sparkle update
# signing key (Varve)"); CI gets them as secrets.

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      SPARKLE_ED_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  bundle:
    name: Bundle (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - asset: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - asset: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # Ubuntu 22.04 keeps the glibc floor at 2.35: an AppImage does not bundle glibc.
          # Moving to a newer runner raises that floor; update install.sh and the README with it.
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - asset: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: macOS release config
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # macOS bundles Sparkle (fetched by beforeBuildCommand). It is a separate config: Tauri's
          # build script checks bundle.macOS.frameworks on every macOS build, so in tauri.conf.json
          # it would break cargo check in a fresh checkout and in apps that build on varve-app.
          # CFBundleVersion is the run number, which only grows: Sparkle orders releases by it
          # (sparkle:version), and any run number is above the "0.1.7" of older builds. The
          # version people see (CFBundleShortVersionString) stays the semver.
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("app/src-tauri/tauri.sparkle.conf.json", "utf8"));
            config.bundle.macOS.bundleVersion = process.env.BUILD_NUMBER;
            fs.writeFileSync("app/src-tauri/tauri.macos-release.conf.json", JSON.stringify(config, null, 2));
          '
          cat app/src-tauri/tauri.macos-release.conf.json
          echo "EXTRA_CONFIG=app/src-tauri/tauri.macos-release.conf.json" >> "$GITHUB_ENV"
      - name: Build Varve
        shell: bash
        env:
          # Ad-hoc signature: no Apple certificate yet, but a valid signature
          # lets macOS offer "Open Anyway" instead of calling the app damaged.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # With CI set, Tauri skips the Finder script that lays out the installer window
          # (background, window size, icon positions); this keeps it.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        # EXTRA_CONFIG comes from the macOS release config step; other platforms have none.
        # No signing keys here: every build script and download in this step could read them.
        # The update signatures are made in their own steps below.
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" ${EXTRA_CONFIG:+--config "$EXTRA_CONFIG"}
      - name: Collect assets under fixed names
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          BUNDLE: target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          # Exactly one file per glob, or the release would ship the wrong one.
          one() {
            local matches=()
            while IFS= read -r -d '' path; do matches+=("$path"); done < <(find "$1" -maxdepth 1 -name "$2" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected one $2 in $1, found ${#matches[@]}" >&2
              ls -la "$1" >&2 || true
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          case "$ASSET" in
            macos-*)
              app="$(one "$BUNDLE/macos" '*.app')"
              # COPYFILE_DISABLE keeps macOS metadata files out of the archive.
              COPYFILE_DISABLE=1 tar -czf "dist/varve-${ASSET}.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
              cp "$(one "$BUNDLE/dmg" '*.dmg')" "dist/varve-${ASSET}.dmg"
              ;;
            windows-*)
              cp "$(one "$BUNDLE/nsis" '*-setup.exe')" "dist/varve-${ASSET}-setup.exe"
              cp "$(one "$BUNDLE/msi" '*.msi')" "dist/varve-${ASSET}.msi"
              ;;
            linux-*)
              cp "$(one "$BUNDLE/appimage" '*.AppImage')" "dist/varve-${ASSET}.AppImage"
              cp "$(one "$BUNDLE/deb" '*.deb')" "dist/varve-${ASSET}.deb"
              ;;
          esac
          ls -la dist
      - name: Sign the Sparkle update (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCHIVE: dist/varve-${{ matrix.asset }}.app.tar.gz
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The EdDSA signature of the archive the appcast offers, checked right away. The key goes
          # in on stdin, never to disk.
          tools=app/src-tauri/macos/sparkle/bin
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$tools/sign_update" --ed-key-file - "$ARCHIVE" > "$ARCHIVE.sparkle"
          signature="$(sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p' "$ARCHIVE.sparkle")"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$tools/sign_update" --verify --ed-key-file - "$ARCHIVE" "$signature"
      - name: Sign the Tauri updates (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every installer gets its <file>.sig for latest.json. The NSIS setup and the AppImage
          # update in app. The .msi and .deb signatures exist only for installs from 0.1.7 and
          # older, which still update in app and would otherwise fall back to the wrong installer
          # (scripts/update-feeds.mjs, TAURI_PLATFORMS); they can go once those installs are gone.
          # The CLI reads the key from the environment. --app-version binds the signature to this
          # version: the app sets requireSignedVersion, so an older signed release cannot be served
          # as a newer one.
          version="${TAG#v}"
          tab="$(printf '\t')"
          for file in dist/*.exe dist/*.msi dist/*.AppImage dist/*.deb; do
            [ -e "$file" ] || continue
            ./node_modules/.bin/tauri signer sign --app-version "$version" "$file" > /dev/null
            test -s "$file.sig"
            # The trusted comment must carry the version (scripts/update-feeds.mjs checks it again).
            trusted="$(base64 -d < "$file.sig" | sed -n 's/^trusted comment: //p')"
            case "${tab}${trusted}${tab}" in
              *"${tab}version:${version}${tab}"*) ;;
              *) echo "the signature of $file does not carry version ${version}: ${trusted}" >&2; exit 1 ;;
            esac
          done
          ls -la dist
      - uses: actions/upload-artifact@v6
        with:
          name: varve-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits since the previous tag make the release notes.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Icon for the Linux desktop entry
        run: cp app/src-tauri/icons/128x128.png dist/varve-icon-128.png
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          expected=(
            varve-macos-arm64.app.tar.gz varve-macos-arm64.dmg
            varve-macos-x64.app.tar.gz varve-macos-x64.dmg
            varve-windows-x64-setup.exe varve-windows-x64.msi
            varve-linux-x64.AppImage varve-linux-x64.deb
            varve-linux-arm64.AppImage varve-linux-arm64.deb
            varve-icon-128.png
          )
          for name in "${expected[@]}"; do
            if [ ! -f "$name" ]; then
              echo "missing release asset: $name" >&2
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # What's new since the previous release, from the commit subjects.
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${TAG}"
          git log --format=%s "$range" | node scripts/release-notes.mjs > notes.md
          printf '\n' >> notes.md
          cat >> notes.md <<'EOF'
          ## Install

          macOS and Linux:

          ```bash
          curl -fsSL https://sherin.dev/varve/install.sh | bash
          ```

          Windows (PowerShell):

          ```powershell
          powershell -c "irm https://sherin.dev/varve/install.ps1|iex"
          ```

          Or download an installer below. Every file is listed in `SHA256SUMS`.
          The macOS builds are not notarized yet: after opening the `.dmg`, use
          **System Settings > Privacy & Security > Open Anyway** once.
          EOF
          # The Sparkle signature lines only feed the appcasts; they are not release assets.
          assets=()
          for file in dist/*; do
            case "$file" in *.sparkle) ;; *) assets+=("$file") ;; esac
          done
          # A draft first: it becomes the latest release, which the apps' update feeds point at,
          # only once the feeds are uploaded too. A rerun after a partial upload replaces the
          # assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "Varve ${TAG}" \
              --notes-file notes.md \
              --generate-notes
          fi
      - name: Publish the update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The release notes without the install section, as Markdown (Tauri updater) and as
          # HTML (Sparkle). GitHub renders the Markdown the way the release page shows it.
          gh release view "$TAG" --json body --jq .body > body.md
          awk 'BEGIN { skip = 0 } /^## Install/ { skip = 1; next } /^## / { skip = 0 } !skip' body.md > update-notes.md
          gh api markdown -f text="$(cat update-notes.md)" -f mode=gfm -f context="$GITHUB_REPOSITORY" > update-notes.html
          # The build number is the run number the macOS bundles carry as CFBundleVersion.
          node scripts/update-feeds.mjs dist "$TAG" "${{ github.run_number }}" update-notes.md update-notes.html
          gh release upload "$TAG" dist/latest.json dist/appcast-arm64.xml dist/appcast-x64.xml --clobber
          # Now the release and its feeds go live together.
          gh release edit "$TAG" --draft=false --latest
