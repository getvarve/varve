<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Varve">
  <title>Varve</title>
  <g transform="scale(2)">
  <defs>
    <linearGradient id="f-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A33"/><stop offset="0.55" stop-color="#16191F"/><stop offset="1" stop-color="#0C0E12"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.34"/><stop offset="0.6" stop-color="#5B4BE0" stop-opacity="0.10"/><stop offset="1" stop-color="#5B4BE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="f-ring-outer" gradientUnits="userSpaceOnUse" x1="96" y1="96" x2="416" y2="416">
      <stop offset="0" stop-color="#C9C1FF"/><stop offset="0.45" stop-color="#8B7CFF"/><stop offset="1" stop-color="#5B4BE0"/>
    </linearGradient>
    <linearGradient id="f-ring-middle" gradientUnits="userSpaceOnUse" x1="138" y1="138" x2="374" y2="374">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C3C8D1"/>
    </linearGradient>
    <linearGradient id="f-ring-inner" gradientUnits="userSpaceOnUse" x1="180" y1="180" x2="332" y2="332">
      <stop offset="0" stop-color="#C2C7D0"/><stop offset="1" stop-color="#7A8190"/>
    </linearGradient>
    <radialGradient id="f-dot" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#A9AFBA"/><stop offset="1" stop-color="#4A5160"/>
    </radialGradient>
    <filter id="f-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="f-lift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="8" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/><feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="f-clip"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#f-clip)">
    <rect width="512" height="512" fill="url(#f-tile)"/>
    <circle cx="256" cy="256" r="250" fill="url(#f-glow)"/>
    <g transform="rotate(-62 256 256)" fill="none" stroke-linecap="round">
      <circle cx="256" cy="256" r="172" stroke="#8B7CFF" stroke-opacity="0.55" stroke-width="44" stroke-dasharray="900 1081" filter="url(#f-bloom)"/>
      <g filter="url(#f-lift)"><circle cx="256" cy="256" r="172" stroke="url(#f-ring-outer)" stroke-width="44" stroke-dasharray="900 1081"/><circle cx="256" cy="256" r="118" stroke="url(#f-ring-middle)" stroke-width="30" stroke-dasharray="618 741"/><circle cx="256" cy="256" r="76" stroke="url(#f-ring-inner)" stroke-width="20" stroke-dasharray="398 478"/></g>
    </g>
    <circle cx="256" cy="256" r="28" fill="url(#f-dot)" filter="url(#f-lift)"/>
    <rect width="512" height="512" fill="url(#f-sheen)"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="url(#f-edge)" stroke-width="2"/>
  </g>
</svg>
