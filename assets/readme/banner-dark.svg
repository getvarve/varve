<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Varve: a calm desktop manager for PostgreSQL, MySQL, MariaDB and Redis">
  <title>Varve: a calm desktop manager for PostgreSQL, MySQL, MariaDB and Redis</title>
