; Production only, on top of php.ini-production and php.ini. The code in the image never changes, so opcache does not
; check files for changes. No preload: FrankenPHP's worker mode keeps the booted app in memory between requests, which
; is what preloading would buy.
opcache.validate_timestamps = 0
; Stated here too, so production never depends on another file for it: just above the 8 MiB a sync push may be, which
; lets the API answer a larger push with its 413 (php.ini).
post_max_size = 9M
