memory_limit = 256M
; A sync push may be 8 MiB (App\Sync\ChangeParser::MAX_BODY_BYTES), and the API itself answers a larger one with 413.
; PHP's own limit (8M by default, the very same number) has to sit above that: PHP drops a body over its limit before
; the API sees it, so the client would get an error about an empty body instead of the documented 413.
post_max_size = 9M
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
apc.enable_cli = 1
session.use_strict_mode = 1
