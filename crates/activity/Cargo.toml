[package]
name = "varve-activity"
description = "Local activity recorder and secret redactor for Varve."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
varve-core.workspace = true
varve-driver.workspace = true
varve-store.workspace = true
varve-redis-syntax.workspace = true
rusqlite.workspace = true
aho-corasick = { version = "1.1.5", default-features = false, features = ["std"] }
sqlparser = { version = "0.63.0", default-features = false, features = ["std", "recursive-protection", "visitor"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1.28.0", default-features = false, features = ["std", "v7", "serde"] }

[dev-dependencies]
# The ignored keyword-list check reads the keywords from real servers.
tokio.workspace = true
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }

[lints]
workspace = true
