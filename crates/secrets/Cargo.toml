[package]
name = "varve-secrets"
description = "OS keychain access for Varve. Secrets never leave the device."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
keyring.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# Linux and the BSDs (where `keyring` uses the Secret Service): the store
# is built here so a failed first build can be retried (see
# `KeychainStore::entry`). Same versions and features as `keyring`'s own.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[lints]
workspace = true
