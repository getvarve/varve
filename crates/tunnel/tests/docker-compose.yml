# Test servers for the varve-tunnel integration tests.
#
#   docker compose -p varve-m1-ssh -f crates/tunnel/tests/docker-compose.yml up -d --wait
#   cargo test -p varve-tunnel -- --include-ignored
#   docker compose -p varve-m1-ssh -f crates/tunnel/tests/docker-compose.yml down -v
#
# The SSH server listens on 127.0.0.1:22022 (user varve, password varve_dev)
# and forwards to `redis:6379`, which is only reachable inside this network.
# Tests install their own generated public keys at runtime.
name: varve-m1-ssh

services:
  openssh:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      USER_NAME: varve
      USER_PASSWORD: varve_dev
      PASSWORD_ACCESS: "true"
      LISTEN_PORT: "2222"
    volumes:
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro
    ports:
      - "127.0.0.1:${VARVE_TUNNEL_SSH_PORT:-22022}:2222"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2222'"]
      interval: 1s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
