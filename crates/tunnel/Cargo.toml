[package]
name = "varve-tunnel"
description = "SSH tunnels for Varve."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
pkcs8 = { version = "0.11.0", features = ["encryption", "std"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
sha1 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tracing.workspace = true
varve-secrets.workspace = true
zeroize.workspace = true

[dev-dependencies]
rand = "0.10.3"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["net", "io-util", "time", "process"] }

[lints]
workspace = true
