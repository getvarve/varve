# Redis 6.2 and 8.10 for `tests/client_key.rs`, listening only on TLS with
# `tls-auth-clients yes`: every client needs a certificate signed by ca.pem.
# The test writes the certificates to a fresh directory, starts this file
# with VARVE_TLSKEY_DIR pointing at it under its own compose project, and
# tears it down again. Host ports are picked by Docker.
#
# Credentials are local test values only.

x-redis: &redis
  volumes: ["${VARVE_TLSKEY_DIR:?set by tests/client_key.rs}:/certs:ro"]
  command:
    - redis-server
    - --port
    - "0"
    - --tls-port
    - "6379"
    - --tls-cert-file
    - /certs/server-cert.pem
    - --tls-key-file
    - /certs/server-key.pem
    - --tls-ca-cert-file
    - /certs/ca.pem
    - --tls-auth-clients
    - "yes"
    - --requirepass
    - varve_dev
    - --save
    - ""
  healthcheck:
    test: ["CMD-SHELL", "redis-cli --tls --cacert /certs/ca.pem --cert /certs/client-cert.pem --key /certs/client-key.pem -a varve_dev --no-auth-warning ping | grep PONG"]
    interval: 1s
    timeout: 3s
    retries: 30
  ports: ["127.0.0.1::6379"]

services:
  redis-6.2:
    <<: *redis
    image: redis:6.2-alpine
  redis-8.10:
    <<: *redis
    image: redis:8.10-alpine
